<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EF;--card:#fff;--text:#1C1917;--t2:#78716C;--t3:#A8A29E;--border:#E7E5E4;--acc:#D97706;--accs:#FEF3C7;--red:#DC2626;--green:#16A34A;--greens:#DCFCE7;--r:14px;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:2rem 1.25rem 4rem}
.logo{font-family:'DM Serif Display',serif;font-size:28px;letter-spacing:-.5px}
.dtag{font-size:12px;color:var(--t3);font-weight:300;margin-bottom:1.5rem}
.htop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.pips{display:flex;gap:4px;margin-bottom:6px}
.pip{flex:1;height:3px;background:var(--border);border-radius:2px;transition:background .4s}
.pip.done{background:var(--text)}.pip.active{background:var(--acc)}
.slbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2rem}
.card{background:var(--card);border-radius:var(--r);padding:1.75rem;box-shadow:var(--sh);border:.5px solid var(--border);margin-bottom:1rem;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.snum{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stitle{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px;letter-spacing:-.3px}
.sdesc{font-size:14px;color:var(--t2);line-height:1.65;margin-bottom:1.5rem;font-weight:300}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btnp{background:var(--text);color:#fff;border-color:transparent}.btnp:hover{opacity:.85;background:var(--text)}
.btna{background:var(--acc);color:#fff;border-color:transparent}.btna:hover{opacity:.9;background:var(--acc)}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.25rem}
textarea,.txtin{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;line-height:1.6;transition:border .2s;margin-bottom:1rem}
textarea{min-height:90px;resize:vertical}
textarea:focus,.txtin:focus{outline:none;border-color:var(--acc)}
.ti{display:flex;align-items:flex-start;gap:10px;padding:11px 14px 11px 16px;background:var(--bg);border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative;margin-bottom:6px;border-left:3px solid var(--border)}
.ti.p1{border-left-color:var(--red)}.ti.p2{border-left-color:var(--acc)}.ti.p3{border-left-color:var(--green)}
.ti:hover{border-color:#C4B5A0}.ti.sel{border-color:var(--text);background:#fff}
.tc{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:500;color:var(--t3);margin-top:1px;transition:all .2s}
.ti.sel .tc{background:var(--text);border-color:var(--text);color:#fff}
.tn{font-size:14px;line-height:1.4;flex:1}
.tsub{font-size:12px;color:var(--t3);margin-top:2px;font-weight:300}
.ibi{padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;transition:opacity .3s}
.iname{font-size:14px;margin-bottom:8px;word-break:break-word;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .15s}
.chip:hover{background:var(--text);color:#fff;border-color:var(--text)}
.chip.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.chip.ok{background:var(--greens);color:var(--green);border-color:transparent;cursor:default}
.gi{padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:6px}
.ga{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;font-weight:500}
.gt{font-size:14px;line-height:1.45;font-weight:300}
.sb{background:var(--bg);border-radius:10px;padding:1.25rem;margin-bottom:1rem;border:1px solid var(--border)}
.slb{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.b3r{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.b3r:last-child{border-bottom:none}
.b3n{font-family:'DM Serif Display',serif;font-size:18px;color:var(--t3);width:22px;flex-shrink:0}
.ld{display:flex;align-items:center;gap:10px;color:var(--t2);font-size:14px;font-weight:300;padding:1rem 0}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{font-size:14px;color:var(--t3);padding:.5rem 0;margin-bottom:1rem;font-weight:300}
.cbadge{display:inline-block;background:var(--accs);color:var(--acc);font-size:12px;padding:2px 10px;border-radius:20px;margin-bottom:1rem;font-weight:500}
.wt{font-family:'DM Serif Display',serif;font-size:16px;line-height:1.5;font-style:italic}
.witem{padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.twitem{padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-left:3px solid var(--border)}
.twitem.p1{border-left-color:var(--red)}.twitem.p2{border-left-color:var(--acc)}
.err{font-size:13px;color:var(--red);padding:.5rem 0}
.backbtn{background:none;border:none;color:var(--t3);font-size:13px;cursor:pointer;padding:0;font-family:'DM Sans',sans-serif;margin-bottom:1.25rem;display:inline-flex;align-items:center;gap:4px}
.backbtn:hover{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <div class="htop"><div class="logo">Start My Day</div><div></div></div>
  <div class="dtag" id="dtag"></div>
  <div class="pips" id="pips"></div>
  <div class="slbl" id="slbl"></div>
  <div id="body"></div>
</div>
<script>
const PROXY = 'https://morning-ritual-production.up.railway.app/todoist';
const PR = {rebuilt:'6gXj8W3Cmh5jfpX8',personal:'6ghgHCjF6vv6mMM9',re:'6gXj8VxFCvr7vqcM',someday:'6gXj8Vx23x479X5j',daily:'6gj8HWmhQ49gXjQC',inbox:'6fw8r3f3225prXvg'};
const GOALS = [
  {area:'Rebuilt', text:'Run 4 cohorts + convert 3-5 cold traffic clients by Aug 19'},
  {area:'Health & Fitness', text:'Train weights 3x/week for 12 consecutive weeks - zero injuries by Aug 19'},
  {area:'Family & Relationships', text:'Attend AA meetings 3x/week for 90 days by Aug 19'},
  {area:'Real Estate', text:'Find next listing opportunity'},
  {area:'Home & Life Admin', text:'Keep life admin stable - bills current, nothing falling through the cracks'}
];
const STEPS = ['Brain','Inbox','This Week','Waiting','Big 3','Goals','Intention','Done'];
let cur = 0, big3 = [], intention = '', ibDone = new Set();

function iso() { return new Date().toISOString().slice(0,10); }
function dstr() { return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }

async function tGet(path) {
  const r = await fetch(PROXY + path);
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  return Array.isArray(d) ? d : (d.results || d);
}

async function tPost(path, data) {
  const r = await fetch(PROXY + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 ? null : r.json();
}

async function tDel(path) {
  await fetch(PROXY + path, {method: 'DELETE'});
}

async function getInbox() { return tGet('/tasks?project_id=' + PR.inbox); }
async function getLabeled(lbl) { return tGet('/tasks?label=' + encodeURIComponent(lbl)); }
async function getToday() {
  const tasks = await tGet('/tasks?filter=' + encodeURIComponent('due before: tomorrow & !#Daily'));
  return tasks.filter(function(t) {
    return !t.content.toLowerCase().includes('intention') && !t.content.toLowerCase().includes('review 90');
  });
}
async function moveTask(id, pid) { return tPost('/tasks/' + id, {project_id: pid}); }
async function delTask(id) { return tDel('/tasks/' + id); }
async function setDue(id, date) { return tPost('/tasks/' + id, {due_date: date}); }
async function addTask(content, desc, pid, prio, due) {
  var b = {content: content, project_id: pid, priority: prio || 4};
  if (desc) b.description = desc;
  if (due) b.due_date = due;
  return tPost('/tasks', b);
}

function updHdr() {
  document.getElementById('pips').innerHTML = STEPS.map(function(s, i) {
    var c = i < cur ? 'done' : i === cur ? 'active' : '';
    return '<div class="pip ' + c + '"></div>';
  }).join('');
  document.getElementById('slbl').textContent = STEPS[cur];
}

function next() { if (cur < STEPS.length - 1) { cur++; render(); } }
function back() { if (cur > 0) { cur--; render(); } }

function render() {
  updHdr();
  var b = document.getElementById('body');
  var s = STEPS[cur], n = cur + 1, t = STEPS.length - 1;
  if (s === 'Brain') rBrain(b, n, t);
  else if (s === 'Inbox') rInbox(b, n, t);
  else if (s === 'This Week') rWeek(b, n, t);
  else if (s === 'Waiting') rWait(b, n, t);
  else if (s === 'Big 3') rBig3(b, n, t);
  else if (s === 'Goals') rGoals(b, n, t);
  else if (s === 'Intention') rInt(b, n, t);
  else rDone(b);
}

function backBtn() {
  return cur > 0 ? '<button class="backbtn" onclick="back()">← Back</button>' : '';
}

// BRAIN
var brainLines = [];

function rBrain(b, n, t) {
  brainLines = [];
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">Brain dump</div>' +
    '<div class="sdesc">Type a thought and hit Enter. Keep going until your head is clear.</div>' +
    '<div style="display:flex;gap:8px;margin-bottom:1rem">' +
    '<input class="txtin" id="bin" type="text" placeholder="Type a thought and hit Enter..." style="margin-bottom:0;flex:1" />' +
    '<button class="btn btnp" onclick="addBrainItem()" style="flex-shrink:0">Add</button></div>' +
    '<div id="brain-list" style="margin-bottom:1rem"></div>' +
    '<div class="brow">' +
    '<button class="btn btnp" id="bbtn" onclick="subBrain()">Done — send to inbox</button>' +
    '<button class="btn" onclick="next()">Nothing on my mind</button></div></div>';
  setTimeout(function() {
    var input = document.getElementById('bin');
    if (input) {
      input.focus();
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addBrainItem(); }
      });
    }
  }, 100);
}

function addBrainItem() {
  var input = document.getElementById('bin');
  if (!input) return;
  var val = input.value.trim();
  if (!val) return;
  brainLines.push(val);
  input.value = '';
  input.focus();
  renderBrainList();
}

function removeBrainItem(idx) {
  brainLines.splice(idx, 1);
  renderBrainList();
}

function renderBrainList() {
  var el = document.getElementById('brain-list');
  if (!el) return;
  if (!brainLines.length) { el.innerHTML = ''; return; }
  el.innerHTML = brainLines.map(function(l, i) {
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-bottom:6px">' +
      '<div style="flex:1;font-size:14px;color:var(--text)">' + l + '</div>' +
      '<button onclick="removeBrainItem(' + i + ')" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;padding:0;line-height:1">&times;</button>' +
      '</div>';
  }).join('');
}

async function subBrain() {
  if (!brainLines.length) { next(); return; }
  var btn = document.getElementById('bbtn');
  btn.disabled = true; btn.textContent = 'Adding to inbox...';
  try {
    for (var i = 0; i < brainLines.length; i++) {
      await addTask(brainLines[i], 'From brain dump', PR.inbox, 4, null);
    }
    brainLines = [];
    next();
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Done - send to inbox';
  }
}

// INBOX
function rInbox(b, n, t) {
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">Process inbox</div>' +
    '<div class="sdesc">Every item gets a decision. Inbox ends at zero.</div>' +
    '<div id="ibody"><div class="ld"><div class="spin"></div>Pulling inbox...</div></div></div>';
  loadInbox();
}

async function loadInbox() {
  try {
    var tasks = await getInbox();
    showInbox(tasks);
  } catch(e) {
    document.getElementById('ibody').innerHTML = '<div class="err">Couldn\'t load inbox.</div><button class="btn btnp" onclick="next()">Skip</button>';
  }
}

function showInbox(tasks) {
  var el = document.getElementById('ibody');
  if (!el) return;
  var rem = tasks.filter(function(t) { return !ibDone.has(t.id); });
  if (!tasks.length || !rem.length) {
    el.innerHTML = '<div style="font-size:20px;margin-bottom:.75rem">✅</div><div style="font-size:14px;color:var(--green);font-weight:500;margin-bottom:1.25rem">Inbox is zero</div><button class="btn btnp" onclick="next()">Next</button>';
    return;
  }
  var rows = rem.map(function(t) {
    return '<div class="ibi" id="ib-' + t.id + '">' +
      '<div class="iname">' + t.content + '</div>' +
      '<div class="chips">' +
      '<button class="chip" onclick="doInbox(\'' + t.id + '\',\'rebuilt\')">Rebuilt</button>' +
      '<button class="chip" onclick="doInbox(\'' + t.id + '\',\'personal\')">Personal</button>' +
      '<button class="chip" onclick="doInbox(\'' + t.id + '\',\'re\')">Real Estate</button>' +
      '<button class="chip" onclick="doInbox(\'' + t.id + '\',\'someday\')">Someday</button>' +
      '<button class="chip del" onclick="doInbox(\'' + t.id + '\',\'delete\')">Delete</button>' +
      '</div></div>';
  }).join('');
  el.innerHTML = '<div class="cbadge">' + rem.length + ' item' + (rem.length !== 1 ? 's' : '') + ' to process</div>' +
    rows + '<button class="btn" onclick="next()" style="margin-top:.5rem">Skip remaining</button>';
}

async function doInbox(id, action) {
  var el = document.getElementById('ib-' + id);
  if (el) { el.style.opacity = '.3'; el.style.pointerEvents = 'none'; }
  ibDone.add(id);
  try {
    if (action === 'delete') await delTask(id);
    else await moveTask(id, PR[action] || PR.someday);
  } catch(e) {}
  if (el) el.remove();
  var rem = document.querySelectorAll('[id^="ib-"]');
  if (!rem.length) {
    var body = document.getElementById('ibody');
    if (body) body.innerHTML = '<div style="font-size:20px;margin-bottom:.75rem">✅</div><div style="font-size:14px;color:var(--green);font-weight:500;margin-bottom:1.25rem">Inbox is zero</div><button class="btn btnp" onclick="next()">Next</button>';
  }
}

// THIS WEEK
function rWeek(b, n, t) {
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">This week</div>' +
    '<div class="sdesc">Tasks committed to this week. Move anything urgent to today.</div>' +
    '<div id="wbody"><div class="ld"><div class="spin"></div>Pulling @thisweek...</div></div></div>';
  loadWeek();
}

async function loadWeek() {
  try {
    var allTasks = await getLabeled('thisweek');
    var today = iso();
    // Only show tasks with no date OR overdue — already-dated future tasks are handled
    var tasks = allTasks.filter(function(t) {
      if (!t.due) return true;
      return t.due.date <= today;
    });
    var el = document.getElementById('wbody');
    if (!el) return;
    if (!tasks.length) {
      el.innerHTML = '<div class="empty">All @thisweek tasks are already scheduled.</div><button class="btn btnp" onclick="next()">Next</button>';
      return;
    }
    var pl = {1:'P1 🔴', 2:'P2 🟡', 3:'P3 🟢', 4:'P4 ⚪'};
    var rows = tasks.map(function(t) {
      return '<div class="twitem p' + (t.priority || 4) + '">' +
        '<div style="flex:1"><div style="font-size:14px;line-height:1.4;word-break:break-word">' + t.content + '</div>' +
        '<div style="font-size:12px;color:var(--t3);margin-top:2px;font-weight:300">' + (pl[t.priority || 4]) + ' · ' + (t.due ? t.due.date : 'No date') + '</div></div>' +
        '<button class="chip" id="twb-' + t.id + '" onclick="twToday(\'' + t.id + '\')">Today</button></div>';
    }).join('');
    el.innerHTML = rows + '<div class="brow"><button class="btn btnp" onclick="next()">Reviewed — next</button></div>';
  } catch(e) {
    document.getElementById('wbody').innerHTML = '<div class="err">Couldn\'t load.</div><button class="btn btnp" onclick="next()">Skip</button>';
  }
}

async function twToday(id) {
  var btn = document.getElementById('twb-' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try { await setDue(id, iso()); } catch(e) {}
  if (btn) { btn.textContent = 'Done'; btn.className = 'chip ok'; }
}

// WAITING
function rWait(b, n, t) {
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">Waiting on</div>' +
    '<div class="sdesc">Things in someone else\'s court. Does anything need a follow-up nudge today?</div>' +
    '<div id="wabody"><div class="ld"><div class="spin"></div>Pulling @waiting...</div></div></div>';
  loadWait();
}

async function loadWait() {
  try {
    var tasks = await getLabeled('waiting');
    var el = document.getElementById('wabody');
    if (!el) return;
    if (!tasks.length) {
      el.innerHTML = '<div class="empty">Nothing waiting on anyone.</div><button class="btn btnp" onclick="next()">Next</button>';
      return;
    }
    var rows = tasks.map(function(t) {
      return '<div class="witem">' +
        '<div style="flex:1"><div style="font-size:14px;line-height:1.4;word-break:break-word">' + t.content + '</div>' +
        '<div style="font-size:12px;color:var(--t3);margin-top:2px;font-weight:300">' + (t.due ? 'Since ' + t.due.date : 'No date') + '</div></div>' +
        '<button class="chip" id="wb-' + t.id + '" onclick="wToday(\'' + t.id + '\')">Follow up today</button></div>';
    }).join('');
    el.innerHTML = rows + '<div class="brow"><button class="btn btnp" onclick="next()">Reviewed — next</button></div>';
  } catch(e) {
    document.getElementById('wabody').innerHTML = '<div class="err">Couldn\'t load.</div><button class="btn btnp" onclick="next()">Skip</button>';
  }
}

async function wToday(id) {
  var btn = document.getElementById('wb-' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try { await setDue(id, iso()); } catch(e) {}
  if (btn) { btn.textContent = 'Scheduled'; btn.className = 'chip ok'; }
}

// BIG 3
function rBig3(b, n, t) {
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">Pick your Big 3</div>' +
    '<div class="sdesc">Tap up to 3. Only 3. The rest can wait.</div>' +
    '<div id="b3body"><div class="ld"><div class="spin"></div>Pulling today\'s tasks...</div></div></div>';
  loadB3();
}

async function loadB3() {
  try {
    var tasks = await getToday();
    showB3(tasks);
  } catch(e) {
    document.getElementById('b3body').innerHTML = '<div class="err">Couldn\'t load tasks.</div><button class="btn btnp" onclick="next()">Skip</button>';
  }
}

function showB3(tasks) {
  var el = document.getElementById('b3body');
  if (!el) return;
  if (!tasks.length) {
    el.innerHTML = '<div class="empty">No tasks due today.</div><button class="btn btnp" onclick="next()">Continue</button>';
    return;
  }
  var sorted = tasks.slice().sort(function(a, b) { return (a.priority || 4) - (b.priority || 4); });
  var rows = sorted.map(function(t) {
    var sel = big3.find(function(s) { return s.id === t.id; });
    var num = sel ? (big3.indexOf(sel) + 1) : '';
    var ov = t.due && t.due.date < iso();
    var taskData = JSON.stringify({id: t.id, content: t.content}).replace(/"/g, '&quot;');
    return '<div class="ti p' + (t.priority || 4) + (sel ? ' sel' : '') + '" onclick="togB3(' + taskData + ')">' +
      '<div class="tc' + (sel ? ' filled' : '') + '">' + num + '</div>' +
      '<div style="flex:1"><div class="tn">' + t.content + '</div>' +
      '<div class="tsub">' + (ov ? '⚠ Overdue' : 'Due today') + '</div></div></div>';
  }).join('');
  el.innerHTML = '<div class="cbadge">' + big3.length + '/3 selected</div>' + rows +
    '<div class="brow"><button class="btn btnp" onclick="confB3()" ' + (!big3.length ? 'disabled' : '') + '>Confirm Big 3</button></div>';
}

function togB3(task) {
  var idx = big3.findIndex(function(t) { return t.id === task.id; });
  if (idx > -1) big3.splice(idx, 1);
  else { if (big3.length >= 3) return; big3.push(task); }
  loadB3();
}

async function confB3() {
  if (big3.length) {
    try { await Promise.all(big3.map(function(t) { return setDue(t.id, iso()); })); } catch(e) {}
  }
  next();
}

// GOALS
function rGoals(b, n, t) {
  var rows = GOALS.map(function(g) {
    return '<div class="gi"><div class="ga">' + g.area + '</div><div class="gt">' + g.text + '</div></div>';
  }).join('');
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">30-second check</div>' +
    '<div class="sdesc">Does what you\'re doing today connect to these?</div>' +
    '<div style="margin-bottom:1.5rem">' + rows + '</div>' +
    '<button class="btn btnp" onclick="next()">Connected — set intention</button></div>';
}

// INTENTION
function rInt(b, n, t) {
  var big3html = '';
  if (big3.length) {
    var b3rows = big3.map(function(item, i) {
      return '<div class="b3r"><span class="b3n">' + (i + 1) + '</span><span style="font-size:14px;color:var(--text);line-height:1.4">' + item.content + '</span></div>';
    }).join('');
    big3html = '<div class="sb" style="margin-bottom:1.25rem"><div class="slb">Your Big 3</div>' + b3rows + '</div>';
  }
  b.innerHTML = '<div class="card">' + backBtn() +
    '<div class="snum">Step ' + n + ' of ' + t + '</div>' +
    '<div class="stitle">Set your intention</div>' +
    '<div class="sdesc">Based on your Big 3, complete this: Today is a win if...</div>' +
    big3html +
    '<input class="txtin" id="iin" type="text" placeholder="the delivery sequence is complete and ads are live..." />' +
    '<div class="brow"><button class="btn btna" id="ibtn" onclick="subInt()">Lock it in</button></div>' +
    '<div id="iout"></div></div>';
}

async function subInt() {
  var val = document.getElementById('iin').value.trim();
  if (!val) return;
  intention = 'Today is a win if ' + val;
  var btn = document.getElementById('ibtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await addTask('Today\'s intention', intention, PR.daily, 1, iso());
    next();
  } catch(e) {
    document.getElementById('iout').innerHTML = '<div class="err">Couldn\'t save — continuing.</div>';
    setTimeout(next, 1500);
  }
}

// DONE
function rDone(b) {
  var names = big3.map(function(t) { return t.content; });
  var intentionHtml = intention ? '<div class="sb"><div class="slb">Win condition</div><div class="wt">' + intention + '</div></div>' : '';
  var b3html = '';
  if (names.length) {
    var rows = names.map(function(n, i) {
      return '<div class="b3r"><span class="b3n">' + (i + 1) + '</span><span style="font-size:14px;color:var(--text);line-height:1.4">' + n + '</span></div>';
    }).join('');
    b3html = '<div class="sb"><div class="slb">Big 3</div>' + rows + '</div>';
  }
  b.innerHTML = '<div class="card" style="text-align:center;padding:2rem">' +
    '<div style="font-size:48px;margin-bottom:1rem">🌅</div>' +
    '<div class="stitle" style="margin-bottom:.5rem">You\'re set.</div>' +
    '<div class="sdesc">Morning ritual complete. Go build.</div></div>' +
    intentionHtml + b3html +
    '<button class="btn" onclick="reset()" style="margin-top:.5rem">↺ Start over</button>';
}

function reset() {
  cur = 0; big3 = []; intention = ''; ibDone = new Set(); brainLines = [];
  render();
}

document.getElementById('dtag').textContent = dstr();
render();
</script>
</body>
</html>
