<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1814;--paper:#F5F1EA;--card:#FDFBF7;--rule:#DDD8CE;--dim:#8C8880;--acc:#C4502A;--acc-soft:#F5EAE5;--gold:#B8932A;--gold-soft:#F7F1E0;--green:#2A7A4B;--green-soft:#E5F2EC;--blue:#2A5C8C;--blue-soft:#E5EEF7;--r:3px;--sh:0 2px 8px rgba(26,24,20,.08),0 0 0 1px rgba(26,24,20,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1.25rem 5rem}
.masthead{border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.5rem}
.masthead-top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:-.5px;line-height:1}
.dateline{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.step-track{display:flex;gap:3px;margin-top:.75rem}
.step-pip{flex:1;height:2px;background:var(--rule)}
.step-pip.done{background:var(--ink)}.step-pip.active{background:var(--acc)}
.step-name{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:.5rem;font-weight:500}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:1.5rem;margin-bottom:.75rem;box-shadow:var(--sh);animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:.4rem;font-weight:500}
.card-title{font-family:'Playfair Display',serif;font-size:24px;line-height:1.15;margin-bottom:.75rem;letter-spacing:-.3px}
.card-body{font-size:14px;color:var(--dim);line-height:1.6;margin-bottom:1.25rem;font-weight:300}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--rule);background:transparent;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;letter-spacing:.01em;white-space:nowrap}
.btn:hover{background:var(--paper)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn-primary:hover{opacity:.85;background:var(--ink)}
.btn-do{background:var(--green-soft);color:var(--green);border-color:rgba(42,122,75,.2)}.btn-do:hover{background:var(--green);color:#fff;border-color:var(--green)}
.btn-del{background:var(--acc-soft);color:var(--acc);border-color:rgba(196,80,42,.2)}.btn-del:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-think{background:var(--gold-soft);color:var(--gold);border-color:rgba(184,147,42,.2)}.btn-think:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-file{background:var(--blue-soft);color:var(--blue);border-color:rgba(42,92,140,.2)}.btn-file:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:1.25rem}
.btn-skip{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 0;text-decoration:underline;text-decoration-color:transparent}
.btn-skip:hover{text-decoration-color:var(--dim)}
.input-row{display:flex;gap:8px;margin-bottom:.75rem}
input[type=text],input[type=date],select{width:100%;padding:9px 11px;border-radius:var(--r);border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:300;transition:border .2s}
input:focus,select:focus{outline:none;border-color:var(--ink)}
select{cursor:pointer}

/* Task items */
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 10px 14px;background:var(--paper);border-radius:var(--r);border:1px solid var(--rule);margin-bottom:5px;border-left:3px solid var(--rule);transition:all .2s}
.task-row.p1{border-left-color:var(--acc)}.task-row.p2{border-left-color:var(--gold)}.task-row.p3{border-left-color:var(--green)}
.task-row.decided{opacity:.3;pointer-events:none}
.task-row.do-it{background:var(--green-soft);border-color:rgba(42,122,75,.2);border-left-color:var(--green)}
.task-row.deliberated{background:var(--gold-soft);border-color:rgba(184,147,42,.2);border-left-color:var(--gold)}
.task-row.dumped{background:var(--acc-soft);border-color:rgba(196,80,42,.2);border-left-color:var(--acc);opacity:.5}
.task-row.filed{background:var(--blue-soft);border-color:rgba(42,92,140,.2);border-left-color:var(--blue)}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;line-height:1.4;word-break:break-word}
.task-meta{font-size:11px;color:var(--dim);margin-top:2px;font-weight:300}
.task-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--rule);color:var(--dim);background:var(--paper);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.tag.inbox{border-color:rgba(42,92,140,.3);color:var(--blue);background:var(--blue-soft)}
.tag.overdue{border-color:rgba(196,80,42,.3);color:var(--acc);background:var(--acc-soft)}
.tag.deliberate{border-color:rgba(184,147,42,.3);color:var(--gold);background:var(--gold-soft)}
.tag.thisweek{border-color:rgba(42,122,75,.3);color:var(--green);background:var(--green-soft)}
.tag.waiting{border-color:rgba(100,100,100,.3);color:var(--dim)}
.tag.recurring{border-color:rgba(42,92,140,.3);color:var(--blue);background:var(--blue-soft)}

/* Sub panel for deliberate/file */
.sub-panel{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin-top:6px;display:none}
.sub-panel.open{display:block}
.sub-label{font-size:10px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.date-opts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.date-chip{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-family:inherit;transition:all .15s;font-weight:400}
.date-chip:hover,.date-chip.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
.proj-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.proj-chip{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--blue-soft);background:var(--blue-soft);color:var(--blue);font-family:inherit;transition:all .15s;font-weight:400}
.proj-chip:hover,.proj-chip.sel{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Summary groups */
.section-head{font-family:'Playfair Display',serif;font-size:15px;padding:.4rem 0;border-bottom:1px solid var(--rule);margin-bottom:.5rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:baseline}
.section-count{font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--dim);font-weight:300}
.decision-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-left:6px}
.db-do{background:var(--green-soft);color:var(--green)}
.db-del{background:var(--acc-soft);color:var(--acc)}
.db-think{background:var(--gold-soft);color:var(--gold)}
.db-file{background:var(--blue-soft);color:var(--blue)}

/* Priority editor */
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border-radius:var(--r);border:1px solid var(--rule);margin-bottom:5px;border-left:3px solid var(--rule);transition:all .2s}
.rank-item.p1{border-left-color:var(--acc)}.rank-item.p2{border-left-color:var(--gold)}.rank-item.p3{border-left-color:var(--green)}
.rank-num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--dim);flex-shrink:0;font-family:'Playfair Display',serif;transition:all .2s;cursor:pointer}
.rank-item.focused .rank-num{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rank-item.focused{border-color:var(--ink);background:var(--card)}
.p-select{padding:3px 6px;border-radius:var(--r);border:1px solid var(--rule);background:var(--paper);font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--dim);cursor:pointer;width:auto}
.p-select:focus{outline:none;border-color:var(--ink)}

/* Goals */
.goal-row{padding:10px 14px;border-left:3px solid var(--ink);margin-bottom:8px;background:var(--card);border-radius:0 var(--r) var(--r) 0}
.goal-area{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);font-weight:500;margin-bottom:2px}
.goal-text{font-size:13px;line-height:1.45;font-weight:300}

/* Loading */
.loading{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:.75rem 0;font-weight:300}
.spin{width:16px;height:16px;border:1.5px solid var(--rule);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-note{font-size:13px;color:var(--dim);font-style:italic;font-weight:300;padding:.5rem 0;margin-bottom:.75rem}

/* Done */
.done-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.done-row:last-child{border-bottom:none}
.done-n{font-family:'Playfair Display',serif;font-size:20px;color:var(--dim);width:24px;flex-shrink:0;font-style:italic}
.done-n.focus{color:var(--acc)}
.back-link{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;margin-bottom:1rem;padding:0}
.back-link:hover{color:var(--ink)}
.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:.75rem;flex-wrap:wrap}
.sort-btn{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--dim);font-family:inherit;font-weight:500;transition:all .15s}
.sort-btn.active,.sort-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
hr{border:none;border-top:1px solid var(--rule);margin:.75rem 0}

.task-desc{font-size:12px;color:var(--dim);line-height:1.5;margin-top:3px;font-weight:300;font-style:italic;word-break:break-word;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){
  :root{--ink:#F0EDE6;--paper:#1A1814;--card:#231F1A;--rule:#3A3530;--dim:#7A756E;--acc:#E06040;--acc-soft:#3A2520;--gold:#D4A840;--gold-soft:#352A18;--green:#3A9A60;--green-soft:#1A3025;--blue:#4A7CB0;--blue-soft:#1A2535;--sh:0 2px 8px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.2)}
  input,select{background:var(--card);color:var(--ink)}
  .date-chip,.sort-btn{background:var(--card)}
  .proj-chip{background:var(--blue-soft)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="masthead-top"><div class="brand">Start My Day</div><div class="dateline" id="dateline"></div></div>
    <div class="step-track" id="step-track"></div>
    <div class="step-name" id="step-name"></div>
  </div>
  <div id="main"></div>
</div>
<script>
const PROXY='https://morning-ritual-production.up.railway.app/todoist';
const PR={rebuilt:'6gXj8W3Cmh5jfpX8',personal:'6ghgHCjF6vv6mMM9',re:'6gXj8VxFCvr7vqcM',someday:'6gXj8Vx23x479X5j',daily:'6gj8HWmhQ49gXjQC',inbox:'6fw8r3f3225prXvg'};
const PROJECTS=[{id:'6gXj8W3Cmh5jfpX8',name:'Rebuilt'},{id:'6ghgHCjF6vv6mMM9',name:'Personal'},{id:'6gXj8VxFCvr7vqcM',name:'Real Estate'},{id:'6gXj8Vx23x479X5j',name:'Someday'}];
const GOALS=[
  {area:'Rebuilt',text:'Run 4 cohorts + convert 3-5 cold traffic clients by Aug 19'},
  {area:'Health & Fitness',text:'Train weights 3x/week for 12 consecutive weeks - zero injuries by Aug 19'},
  {area:'Family & Relationships',text:'Attend AA meetings 3x/week for 90 days by Aug 19'},
  {area:'Real Estate',text:'Find next listing opportunity'},
  {area:'Home & Life Admin',text:'Keep life admin stable - bills current, nothing falling through the cracks'}
];
const STEPS=['Brain','Targets','Decide','Recurring','Prioritize','Intention','Done'];
const P_COLORS={1:'#DC2626',2:'#D97706',3:'#16A34A',4:'#9CA3AF'};
const P_LABELS={1:'P1',2:'P2',3:'P3',4:'P4'};

var cur=0,brainLines=[],allItems=[],decisions={},deletedIds=new Set(),
    recurDone=new Set(),recurAdded=[],finalItems=[],todayCommitted=[],
    ranked=[],intention='',sortMode='priority',refineDecisions={},
    taskRegistry={},deliberateSel={},decidePhase='deciding';

function iso(){return new Date().toISOString().slice(0,10);}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function dstr(){return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function pLabel(p){return P_LABELS[p]||'P4';}
function pPill(p){return '<span style="font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid '+P_COLORS[p||4]+'33;color:'+P_COLORS[p||4]+';background:'+P_COLORS[p||4]+'15;font-weight:500;letter-spacing:.03em">'+pLabel(p||4)+'</span>';}
function srcTag(src){var m={inbox:'Inbox',overdue:'Overdue',deliberate:'Deliberate',thisweek:'This week',waiting:'Waiting'};return '<span class="tag '+src+'">'+(m[src]||src)+'</span>';}
function sortP(arr){return arr.slice().sort(function(a,b){return (a.priority||4)-(b.priority||4);});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function tGet(p){var r=await fetch(PROXY+p);if(!r.ok)throw new Error(r.status);var d=await r.json();return Array.isArray(d)?d:(d.results||d);}
async function tPost(p,data){var r=await fetch(PROXY+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json();}
async function tDel(p){await fetch(PROXY+p,{method:'DELETE'});}
async function getInbox(){return tGet('/tasks?project_id='+PR.inbox);}
async function getOverdue(){
  try{var t=await tFilterPost('overdue');
  return t.filter(function(x){
    if(x.due&&x.due.is_recurring)return false;
    var c=x.content.toLowerCase();
    return !c.includes('intention')&&!c.includes('review 90')&&!c.includes('90-day goal')&&!c.includes('sunday review')&&!c.includes('standing agenda')&&x.project_id!==PR.daily&&!deletedIds.has(x.id);
  });}catch(e){return[];}}
async function tFilterPost(query){
  var r=await fetch(PROXY+'/tasks/filter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query})});
  if(!r.ok){var err=await r.text();console.error('tFilter error',r.status,err);throw new Error(r.status);}
  var d=await r.json();return Array.isArray(d)?d:(d.results||d);
}
async function getDeliberateDue(){try{var t=await tGet('/tasks?label=deliberate');var today=iso();return t.filter(function(x){return x.due&&x.due.date<=today;});}catch(e){console.error('getDeliberateDue',e);return[];}}
async function getThisweekUnscheduled(){try{var t=await tGet('/tasks?label=thisweek');var today=iso();return t.filter(function(x){return !x.due||x.due.date===today;});}catch(e){console.error('getThisweek',e);return[];}}
async function getWaiting(){try{return await tGet('/tasks?label=waiting');}catch(e){console.error('getWaiting',e);return[];}}
async function getRecurring(){try{var t=await tFilterPost('today | overdue');return t.filter(function(x){return x.due&&x.due.is_recurring&&!deletedIds.has(x.id);});}catch(e){console.error('getRecurring',e);return[];}}
async function getToday(){try{var t=await tFilterPost('today');return sortP(t.filter(function(x){var c=x.content.toLowerCase();return !c.includes('intention')&&!c.includes('review 90')&&x.project_id!==PR.daily&&!deletedIds.has(x.id);}));}catch(e){console.error('getToday',e);return[];}}
async function delTask(id){deletedIds.add(id);return tDel('/tasks/'+id);}
async function setDue(id,date){return tPost('/tasks/'+id,{due_date:date});}
async function setLabels(id,labels){return tPost('/tasks/'+id,{labels:labels});}
async function setPriority(id,prio){return tPost('/tasks/'+id,{priority:prio});}
async function moveTask(id,pid){return tPost('/tasks/'+id,{project_id:pid});}
async function addTask(content,desc,pid,prio,due){var b={content:content,project_id:pid,priority:prio||4};if(desc)b.description=desc;if(due)b.due_date=due;return tPost('/tasks',b);}

function updHdr(){
  document.getElementById('step-track').innerHTML=STEPS.map(function(s,i){return '<div class="step-pip '+(i<cur?'done':i===cur?'active':'')+'"></div>';}).join('');
  document.getElementById('step-name').textContent=STEPS[cur];
}
function next(){if(cur<STEPS.length-1){cur++;render();}}
function back(){if(cur>0){cur--;render();}}
function bbtn(){return cur>0?'<button class="back-link" onclick="back()">&#8592; Back</button>':'';}
function render(){updHdr();var m=document.getElementById('main'),s=STEPS[cur];if(s==='Brain')rBrain(m);else if(s==='Targets')rTargets(m);else if(s==='Decide')rDecide(m);else if(s==='Recurring')rRecurring(m);else if(s==='Prioritize')rPrioritize(m);else if(s==='Intention')rIntention(m);else rDone(m);}

// task tile - shared renderer
function taskTile(t, opts){
  // opts: {decided, decisionLabel, decisionCls, extra, showDesc, showActions, showRefine, showChange}
  opts = opts || {};
  var p = t.priority || 4;
  var cls = 'task-row p'+p+(opts.decided?' '+opts.decisionCls:'');
  var desc = (opts.showDesc && t.description) ? '<div class="task-desc">'+esc(t.description)+'</div>' : '';
  var meta = '<div class="task-meta">'+pPill(p)+' '+srcTag(t._src||'');
  if(opts.decisionLabel) meta += ' <span style="font-size:10px;font-weight:500;color:var(--dim)">'+opts.decisionLabel+'</span>';
  if(opts.extra) meta += ' &middot; '+opts.extra;
  if(opts.showChange) meta += '<button data-action="undecide" data-id="'+t.id+'" onclick="handleClick(this)" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;margin-left:6px;font-family:inherit;text-decoration:underline">change</button>';
  meta += '</div>';
  var actions = '';
  if(opts.showActions){
    actions = '<div class="task-actions">'+
      '<button class="btn btn-do" data-action="decide-do" data-id="'+t.id+'" onclick="handleClick(this)">&#10003; Do it</button>'+
      '<button class="btn btn-file" data-action="open-file" data-id="'+t.id+'" onclick="handleClick(this)">File</button>'+
      '<button class="btn btn-think" data-action="open-delib" data-id="'+t.id+'" onclick="handleClick(this)">Deliberate</button>'+
      '<button class="btn btn-del" data-action="decide-dump" data-id="'+t.id+'" onclick="handleClick(this)">Dump</button>'+
      '</div>'+
      '<div class="sub-panel" id="fp-'+t.id+'">'+
      '<div class="sub-label">Move to project</div>'+
      '<div class="proj-chips">'+PROJECTS.map(function(p){return '<button class="proj-chip" data-action="file-proj" data-id="'+t.id+'" data-proj="'+p.id+'" onclick="handleClick(this)">'+p.name+'</button>';}).join('')+'</div>'+
      '</div>'+
      '<div class="sub-panel" id="dp-'+t.id+'">'+
      '<div class="sub-label">Surface back up...</div>'+
      '<div class="date-opts">'+
      '<button class="date-chip" data-action="delib-date" data-id="'+t.id+'" data-when="tomorrow" onclick="handleClick(this)">Tomorrow</button>'+
      '<button class="date-chip" data-action="delib-date" data-id="'+t.id+'" data-when="nextweek" onclick="handleClick(this)">Next week</button>'+
      '<button class="date-chip" data-action="delib-date" data-id="'+t.id+'" data-when="custom" onclick="handleClick(this)">Pick date</button>'+
      '</div>'+
      '<div id="delib-custom-'+t.id+'" style="display:none;margin-top:6px"><input type="date" onchange="deliberateCustomDate(\''+t.id+'\',this.value)" /></div>'+
      '<div class="proj-chips" style="margin-top:6px"><span style="font-size:11px;color:var(--dim)">Also file in:</span>'+PROJECTS.map(function(p){return '<button class="proj-chip" id="delfp-'+t.id+'-'+p.id+'" data-action="delib-proj" data-id="'+t.id+'" data-proj="'+p.id+'" onclick="handleClick(this)">'+p.name+'</button>';}).join('')+'</div>'+
      '</div>';
  }
  if(opts.showRefine){
    actions = '<div class="task-actions">'+
      '<button class="btn btn-do" data-action="refine-now" data-id="'+t.id+'" onclick="handleClick(this)">Now</button>'+
      '<button class="btn btn-think" data-action="open-sched" data-id="'+t.id+'" onclick="handleClick(this)">Schedule</button>'+
      '<button class="btn" data-action="refine-delegate" data-id="'+t.id+'" onclick="handleClick(this)">Delegate</button>'+
      '<button class="btn btn-del" data-action="refine-dump" data-id="'+t.id+'" onclick="handleClick(this)">Dump</button>'+

  loadDecide();

async function loadDecide(){
  try{
    var inbox=await getInbox(),overdue=await getOverdue(),delib=await getDeliberateDue(),tw=await getThisweekUnscheduled(),wait=await getWaiting();
    var tag=function(arr,src){arr.forEach(function(t){t._src=src;taskRegistry[t.id]=t;});};
    tag(inbox,'inbox');tag(overdue,'overdue');tag(delib,'deliberate');tag(tw,'thisweek');tag(wait,'waiting');
    var seen=new Set(),all=[];
    [inbox,overdue,delib,tw,wait].forEach(function(arr){arr.forEach(function(t){if(!seen.has(t.id)&&!deletedIds.has(t.id)){seen.add(t.id);all.push(t);}});});
    allItems=sortP(all);decisions={};deliberateSel={};decidePhase='deciding';
    showDecide();
  }catch(e){document.getElementById('decide-body').innerHTML='<div class="empty-note">Could not load items.</div><button class="btn btn-primary" onclick="next()">Skip</button>';}
}

var dCls={do:'do-it',file:'filed',deliberate:'deliberated',dump:'dumped'};
var dLabel={do:'Do it',file:'Filed',deliberate:'Deliberate',dump:'Dump it'};

function showDecide(){
  if(decidePhase==='summary'){showSummary();return;}
  var el=document.getElementById('decide-body');if(!el)return;
  var pending=allItems.filter(function(t){return !decisions[t.id]&&!deletedIds.has(t.id);});
  if(!allItems.length){el.innerHTML='<div class="empty-note">Nothing needs a decision.</div><button class="btn btn-primary" onclick="next()">Next</button>';return;}
  if(!pending.length){decidePhase='summary';showSummary();return;}

  // ALL items shown, decided ones show their label + change button (no action buttons)
  var html=allItems.filter(function(t){return !deletedIds.has(t.id);}).map(function(t){
    var d=decisions[t.id];
    if(d){
      // show as decided tile with label
      var extra='';
      if(d.action==='deliberate'&&d.date)extra=d.date;
      if(d.action==='file'&&d.projectId){var p=PROJECTS.find(function(x){return x.id===d.projectId;});if(p)extra=p.name;}
      return taskTile(t,{decided:true,decisionCls:dCls[d.action]||'',decisionLabel:dLabel[d.action]||'',extra:extra,showDesc:true,showChange:true});
    } else {
      return taskTile(t,{showDesc:true,showActions:true});
    }
  }).join('');

  el.innerHTML=html+'<div class="btn-row"><button class="btn-skip" data-action="skip-remaining" onclick="handleClick(this)">Skip remaining '+pending.length+' items</button></div>';
}

function deliberateCustomDate(id,val){if(!val)return;if(!deliberateSel[id])deliberateSel[id]={};deliberateSel[id].date=val;commitDeliberate(id);}

async function commitDeliberate(id){
  var sel=deliberateSel[id]||{};if(!sel.date)return;
  decisions[id]={action:'deliberate',date:sel.date,projectId:sel.projectId||null};
  try{await setDue(id,sel.date);var task=taskRegistry[id];var labels=task?(task.labels||[]).filter(function(l){return l!=='thisweek'&&l!=='waiting';}).concat(['deliberate']):['deliberate'];await setLabels(id,labels);if(sel.projectId)await moveTask(id,sel.projectId);}catch(e){}
  showDecide();
}

function showSummary(){
  var el=document.getElementById('decide-body');if(!el)return;
  var groups={do:[],file:[],deliberate:[],dump:[]};
  allItems.forEach(function(t){var d=decisions[t.id];if(d&&groups[d.action])groups[d.action].push(t);});

  var html='<div style="font-size:12px;color:var(--dim);margin-bottom:.75rem">Decisions made. Now refine your Do It list.</div>';

  // Summary tiles - compact, no action buttons, show label
  ['do','file','deliberate','dump'].forEach(function(action){
    var items=groups[action];if(!items.length)return;
    html+='<div class="section-head">'+dLabel[action]+' <span class="section-count">'+items.length+'</span></div>';
    html+=items.map(function(t){
      var d=decisions[t.id],extra='';
      if(action==='deliberate'&&d.date)extra=d.date;
      if(action==='file'&&d.projectId){var p=PROJECTS.find(function(x){return x.id===d.projectId;});if(p)extra=p.name;}
      return taskTile(t,{decided:true,decisionCls:dCls[action],showChange:(action!=='dump'),extra:extra,showDesc:false});
    }).join('');
  });

  // Refine Do It - inline buttons on SAME tile, no duplicate list below
  var doItems=groups.do;
  if(doItems.length){
    html+='<hr style="border:none;border-top:1px solid var(--rule);margin:1rem 0"><div style="font-family:\'Playfair Display\',serif;font-size:17px;margin-bottom:.4rem">Refine your Do It list</div>';
    html+='<div style="font-size:12px;color:var(--dim);margin-bottom:.75rem;font-weight:300">Do it now, schedule, delegate, or change your mind.</div>';
    html+=doItems.map(function(t){
      var r=refineDecisions[t.id];
      if(r){
        var rl={now:'Doing now',schedule:'Scheduled',delegate:'Delegating',dump:'Dumped'};
        return '<div class="task-row p'+(t.priority||4)+'" style="opacity:.5"><div class="task-info"><div class="task-name">'+esc(t.content)+'</div><div class="task-meta">'+pPill(t.priority||4)+' <span style="font-size:10px;font-weight:500">'+(rl[r.action]||''+(r.date?' &middot; '+r.date:''))+'</span></div></div></div>';
      }
      return taskTile(t,{showDesc:true,showRefine:true});
    }).join('');
  }

  html+='<div class="btn-row"><button class="btn btn-primary" onclick="finishDecide()">Done &#8212; move to recurring</button></div>';
  el.innerHTML=html;
}

function schedCustom(id,val){if(!val)return;applyRefine(id,'schedule',val);}
async function applyRefine(id,action,date){
  refineDecisions[id]={action:action,date:date};
  try{if(action==='now')await setDue(id,iso());else if(action==='schedule'&&date)await setDue(id,date);else if(action==='dump')await delTask(id);}catch(e){}
  // Update tile in place
  var el=document.getElementById('dr-'+id);
  if(el){
    var rl={now:'Doing now',schedule:'Scheduled for '+(date||''),delegate:'Delegating',dump:'Dumped'};
    el.style.opacity='.5';el.style.pointerEvents='none';
    var meta=el.querySelector('.task-meta');
    if(meta){var sp=el.querySelector('.sub-panel');if(sp)sp.remove();var acts=el.querySelector('.task-actions');if(acts)acts.remove();meta.innerHTML=pPill(el.className.includes('p1')?1:el.className.includes('p2')?2:el.className.includes('p3')?3:4)+' <span style="font-size:10px;font-weight:500">'+(rl[action]||action)+'</span>';}
  }
}

function finishDecide(){
  var doItems=allItems.filter(function(t){return decisions[t.id]&&decisions[t.id].action==='do';});
  finalItems=doItems.filter(function(t){var r=refineDecisions[t.id];if(!r)return true;return r.action==='now'||r.action==='schedule';});
  next();
}

// PRIORITIZE
function rPrioritize(m){
  m.innerHTML='<div class="card">'+bbtn()+'<div class="card-eyebrow">Step 5 of '+(STEPS.length-1)+'</div><div class="card-title">Prioritize</div><div class="card-body">Everything you\'re doing today. Tap to mark focus items. Use P dropdown to re-rank.</div><div id="pri-body"><div class="loading"><div class="spin"></div>Building today\'s list...</div></div></div>';

async function loadPrioritize(){
  try{
    var today=await getToday();
    var seen=new Set(),all=[];
    finalItems.forEach(function(t){if(!seen.has(t.id)&&!deletedIds.has(t.id)){seen.add(t.id);all.push(t);}});
    recurAdded.forEach(function(t){if(!seen.has(t.id)&&!deletedIds.has(t.id)){seen.add(t.id);all.push(t);}});
    today.forEach(function(t){if(!seen.has(t.id)&&!deletedIds.has(t.id)){seen.add(t.id);all.push(t);}});
    todayCommitted=sortP(all);ranked=[];sortMode='priority';
    showPrioritize();
  }catch(e){document.getElementById('pri-body').innerHTML='<div class="empty-note">Could not load.</div><button class="btn btn-primary" onclick="next()">Skip</button>';}
}
function showPrioritize(){
  var el=document.getElementById('pri-body');if(!el)return;
  if(!todayCommitted.length){el.innerHTML='<div class="empty-note">Nothing committed to today yet.</div><div class="btn-row"><button class="btn btn-primary" onclick="next()">Next</button></div>';return;}
  var sorted=todayCommitted.slice();
  if(sortMode==='focus')sorted.sort(function(a,b){var ai=ranked.findIndex(function(r){return r.id===a.id;}),bi=ranked.findIndex(function(r){return r.id===b.id;});if(ai>-1&&bi>-1)return ai-bi;if(ai>-1)return -1;if(bi>-1)return 1;return(a.priority||4)-(b.priority||4);});
  else sorted=sortP(sorted);
  el.innerHTML='<div class="sort-bar"><span style="font-size:11px;color:var(--dim);font-weight:300">Sort:</span><button class="sort-btn'+(sortMode==='priority'?' active':'')+'" onclick="setSort(\'priority\')">Priority</button><button class="sort-btn'+(sortMode==='focus'?' active':'')+'" onclick="setSort(\'focus\')">Focus first</button></div>'+
    '<div style="font-size:11px;color:var(--acc);font-weight:500;margin-bottom:.75rem">'+ranked.length+' focus item'+(ranked.length!==1?'s':'')+' (tap row to toggle)</div>'+
    sorted.map(function(t){
      var ri=ranked.findIndex(function(r){return r.id===t.id;}),isFocus=ri>-1;
      return '<div class="rank-item p'+(t.priority||4)+(isFocus?' focused':'')+'" data-action="toggle-rank" data-id="'+t.id+'" onclick="handleClick(this)">'+
        '<div class="rank-num">'+(isFocus?(ri+1):'&middot;')+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-size:13px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.content)+'</div></div>'+
        '<select class="p-select" data-action="change-p" data-id="'+t.id+'" onclick="event.stopPropagation()" onchange="handlePChange(this)" style="border-color:'+P_COLORS[t.priority||4]+';color:'+P_COLORS[t.priority||4]+'">'+
        '<option value="1"'+(t.priority===1?' selected':'')+'>P1</option>'+
        '<option value="2"'+(t.priority===2?' selected':'')+'>P2</option>'+
        '<option value="3"'+(t.priority===3?' selected':'')+'>P3</option>'+
        '<option value="4"'+((!t.priority||t.priority===4)?' selected':'')+'>P4</option>'+
        '</select></div>';
    }).join('')+
    '<div class="btn-row"><button class="btn btn-primary" onclick="next()">Ranking set &#8212; next</button></div>';
}
function setSort(m){sortMode=m;showPrioritize();}
function handlePChange(sel){var id=sel.getAttribute('data-id'),p=parseInt(sel.value);var t=todayCommitted.find(function(x){return x.id===id;});if(t)t.priority=p;try{setPriority(id,p);}catch(e){}showPrioritize();}

// CENTRAL CLICK HANDLER
async function handleClick(el){
  var action=el.getAttribute('data-action'),id=el.getAttribute('data-id');
  if(action==='removebrain'){removeBL(parseInt(el.getAttribute('data-idx')));return;}
  if(action==='undecide'){delete decisions[id];decidePhase='deciding';showDecide();return;}
  if(action==='decide-do'){decisions[id]={action:'do'};try{await setDue(id,iso());}catch(e){}showDecide();return;}
  if(action==='decide-dump'){decisions[id]={action:'dump'};try{await delTask(id);}catch(e){}showDecide();return;}
  if(action==='open-file'){var fp=document.getElementById('fp-'+id),dp=document.getElementById('dp-'+id);if(dp)dp.classList.remove('open');if(fp)fp.classList.toggle('open');return;}
  if(action==='open-delib'){var dp2=document.getElementById('dp-'+id),fp2=document.getElementById('fp-'+id);if(fp2)fp2.classList.remove('open');if(dp2)dp2.classList.toggle('open');return;}
  if(action==='file-proj'){var pid=el.getAttribute('data-proj');decisions[id]={action:'file',projectId:pid};try{await moveTask(id,pid);}catch(e){}var fp3=document.getElementById('fp-'+id);if(fp3)fp3.classList.remove('open');showDecide();return;}
  if(action==='delib-date'){
    var when=el.getAttribute('data-when');
    if(!deliberateSel[id])deliberateSel[id]={};
    var chips=el.parentNode.querySelectorAll('.date-chip');chips.forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');
    if(when==='tomorrow'){deliberateSel[id].date=addDays(1);commitDeliberate(id);}
    else if(when==='nextweek'){deliberateSel[id].date=addDays(7);commitDeliberate(id);}
    else if(when==='custom'){var cw=document.getElementById('delib-custom-'+id);if(cw)cw.style.display='block';}
    return;
  }
  if(action==='delib-proj'){var proj=el.getAttribute('data-proj');if(!deliberateSel[id])deliberateSel[id]={};deliberateSel[id].projectId=deliberateSel[id].projectId===proj?null:proj;el.classList.toggle('sel',!!deliberateSel[id].projectId);return;}
  if(action==='skip-remaining'){allItems.forEach(function(t){if(!decisions[t.id])decisions[t.id]={action:'skip'};});decidePhase='summary';showSummary();return;}
  if(action==='refine-now'){applyRefine(id,'now',null);return;}
  if(action==='refine-delegate'){refineDecisions[id]={action:'delegate'};var ri=document.getElementById('dr-'+id);if(ri){ri.style.opacity='.5';ri.style.pointerEvents='none';}return;}
  if(action==='refine-dump'){refineDecisions[id]={action:'dump'};try{await delTask(id);}catch(e){}var ri2=document.getElementById('dr-'+id);if(ri2){ri2.style.opacity='.5';ri2.style.pointerEvents='none';}return;}
  if(action==='open-sched'){var sp=document.getElementById('sp-'+id);if(sp)sp.classList.toggle('open');return;}
  if(action==='sched-pick'){
    var when2=el.getAttribute('data-when');
    var chips2=el.parentNode.querySelectorAll('.date-chip');chips2.forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');
    if(when2==='tomorrow'){applyRefine(id,'schedule',addDays(1));}
    else if(when2==='nextweek'){applyRefine(id,'schedule',addDays(7));}
    else if(when2==='custom'){var sw=document.getElementById('sdate-'+id);if(sw)sw.style.display='block';}
    return;
  }
  if(action==='recur-do'){recurDone.add(id);var task=taskRegistry[id]||allItems.find(function(t){return t.id===id;});try{await setDue(id,iso());if(task)recurAdded.push(task);}catch(e){}var re=document.getElementById('rec-'+id);if(re){re.style.opacity='.3';setTimeout(function(){if(re.parentNode)re.remove();},300);}return;}
  if(action==='recur-skip'){recurDone.add(id);var re2=document.getElementById('rec-'+id);if(re2){re2.style.opacity='.3';setTimeout(function(){if(re2.parentNode)re2.remove();},300);}return;}
  if(action==='recur-remove'){recurDone.add(id);try{await delTask(id);}catch(e){}var re3=document.getElementById('rec-'+id);if(re3){re3.style.opacity='.3';setTimeout(function(){if(re3.parentNode)re3.remove();},300);}return;}
  if(action==='toggle-rank'){var t3=todayCommitted.find(function(x){return x.id===id;});if(!t3)return;var ri3=ranked.findIndex(function(r){return r.id===id;});if(ri3>-1)ranked.splice(ri3,1);else ranked.push(t3);showPrioritize();return;}
}

function resetAll(){
  cur=0;brainLines=[];allItems=[];decisions={};deletedIds=new Set();recurDone=new Set();recurAdded=[];finalItems=[];todayCommitted=[];ranked=[];intention='';sortMode='priority';refineDecisions={};deliberateSel={};decidePhase='deciding';taskRegistry={};
  render();
}

document.getElementById('dateline').textContent=dstr();
render();
